<svg xmlns="http://www.w3.org/2000/svg" width="900" height="792" viewBox="0 0 900 792" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Three stacked layers: the files codevira writes into your project repo, the single pipx-installed binary, and the IDE hook points that call it.">
<title>Codevira file layout and hook flow — what lands in your repo, and where it is called from</title>
<desc>A light sheet in three stacked bands. Band one, IN THE PROJECT REPO, holds the canonical .codevira/ card listing nine files — decisions.jsonl (full text plus metadata, append-only), digest.jsonl (slim summary for prompt injection), outcomes.jsonl (kept or reverted, from git observation), manifest.yaml (tag to ids and file to ids index, regenerated), enforcement.yaml (which decisions hard-block), config.yaml (project settings), sessions.jsonl (session events), roadmap.yaml (phase tracking) and skills.jsonl (written once you record a skill). Beside it sits the generated AGENTS.md card, a violet arrow showing it is generated from the decision log, and the gitignored .codevira-cache/ card holding fts5.sqlite, hash-cache.db and working.jsonl, with a note that the code graph is a per-project SQLite database under the global home. A two-headed connector labelled MCP and hooks joins band one to band two, PIPX INSTALL, a single blue-to-violet gradient card for the codevira CLI and MCP server: roughly 66 MB of venv, no chromadb, sentence-transformers or torch, no model, cold start well under one second and warm tool calls around two milliseconds. A second two-headed connector labelled stdio MCP joins band two to band three, YOUR IDE, which lists the four hook points — UserPromptSubmit into a relevance-gated inject, Edit or Write into PreToolUse which blocks a do_not_revert violation, PostToolUse into the post-edit graph refresh and working-memory fanout, and Stop into the token-budget and session-log enforcers. A footnote records that codevira init scaffolds everything except roadmap.yaml and skills.jsonl, which are written on first use.</desc>
<defs>
  <linearGradient id="focal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0064d6"/><stop offset="1" stop-color="#5a5fe0"/>
  </linearGradient>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#1b1f27" flood-opacity="0.07"/>
  </filter>
  <filter id="shbig" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#2b2f7a" flood-opacity="0.20"/>
  </filter>
  <marker id="aSlate" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
    <path d="M0 0 L9 3.5 L0 7 z" fill="#6b7683"/></marker>
  <marker id="aSlateBack" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto">
    <path d="M9 0 L0 3.5 L9 7 z" fill="#6b7683"/></marker>
  <marker id="aViolet" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
    <path d="M0 0 L9 3.5 L0 7 z" fill="#5a5fe0"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#1b1f27}
    .h1{font-size:18px;font-weight:700;letter-spacing:-0.2px}
    .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:0.08em;fill:#0b4a80}
    .ct{font-size:11.5px;font-weight:600}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px;font-weight:600}
    .f{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:#39414a}
    .d{font-size:10.5px;fill:#5b6472}
    .mut{font-size:10.5px;fill:#5b6472}
    .onfocal{fill:#ffffff}
    .rule{stroke-width:2.4;stroke-linecap:round;fill:none}
  </style>
</defs>

<rect x="0" y="0" width="900" height="792" fill="#f3f5f9"/>
<text class="h1" x="24" y="42">Full file layout and hook flow</text>
<text class="mut" x="24" y="60">Three layers: what lands in your repo, the one binary that reads it, and where your IDE calls in.</text>

