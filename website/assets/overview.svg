    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0064d6"/>
      <stop offset="0.5" stop-color="#3560de"/>
      <stop offset="1" stop-color="#5a5fe0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffa726"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a5fe0" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#0064d6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0064d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b1f27" flood-opacity="0.08"/>
    </filter>
    <filter id="softLg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1b1f27" flood-opacity="0.10"/>
