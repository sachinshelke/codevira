[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codevira"
version = "4.2.0"
description = "Cross-IDE decision enforcement for AI coding agents. 1 MB per project, in your repo, no cloud, no vectors. Claude Code, Cursor, Windsurf, Antigravity, Codex all share the same in-repo memory; hooks block AI tool calls that violate prior decisions. MIT, local-first."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Sachin Shelke", email = "sachin.worldnet@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-agents",
  "llm",
  "developer-tools",
  "claude",
  "cursor",
  "windsurf",
  "code-intelligence",
  "enforcement",
  "agents-md",
  "context-graph",
  "agentic",
  "coding-assistant",
  "knowledge-graph"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "pyyaml>=6.0",
  "mcp>=1.0,<2",
  "watchdog>=3.0.0",
  # tomllib is stdlib on 3.11+; tomli is the backport for the declared
  # 3.10 support (used to read pyproject.toml project name).
  "tomli>=2.0; python_version < '3.11'",
  "tree-sitter>=0.23.0",
  # v2.2.0: switched from tree-sitter-language-pack (351 MB, 17 grammars) to
  # individual grammar packages for the 4 most-used non-Python languages
  # (Python parsing uses stdlib `ast`). Total grammar footprint ~10-15 MB
  # instead of 351 MB — the v2.2.0 ≤55 MB pipx budget (G1) depends on it.
  # Long-tail languages (Java/C/C++/Ruby/PHP/Kotlin/Swift/Solidity) are NOT
  # bundled — the legacy [all-languages] grammar pack was removed in v2.2.0;
  # AI agents Read those files directly. v2.3.0 may add specific grammars.
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "rich>=13.0.0",
  "pathspec>=0.12.0",
  # v2.2.0: chromadb / sentence-transformers / torch REMOVED. Decision
  # search uses SQLite FTS5 (stdlib). 200 MB pipx install → ~50 MB.
  # Code search isn't a codevira concern — AI agents grep + Read directly.
]

[project.optional-dependencies]
# Kept as no-op aliases so old `pip install codevira[search]` doesn't error.
# v2.2.0+ has no optional semantic-search extras and no [all-languages]
# extra (the legacy tree-sitter-language-pack was removed along with the
# v2.1.x carryover user base). v2.3.0 may re-introduce specific
# long-tail grammars as individual deps if real demand emerges.
# HTTP transport (`codevira serve`).
#
# MEASURED CAVEAT — this does NOT shrink the install. `mcp` itself
# requires starlette and uvicorn transitively, so both land in every
# venv regardless; the pipx install is 67 MB either way. What this
# extra buys is honesty about OUR direct requirements: codevira needs
# them only for `codevira serve`, and if the MCP SDK ever drops them
# the declaration is already correct. The dependency COUNT moves
# 13 -> 11; the FOOTPRINT does not. Do not cite this as a size win.
http = ["uvicorn>=0.27.0", "starlette>=0.36.0"]
search = []
all = []
# Dev dependencies for contributors. Installed via: pip install -e ".[dev]"
# Or use the Makefile target: make dev
# These power the discipline scaffold (Pillar 3): pre-commit, lint, type-check, e2e tests.
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "pytest-timeout>=2.1",
  # Shuffles test order for `make test-unit-random` (a separate CI job — the
  # default `make test-unit` stays in collection order so the local loop is
  # reproducible). Collection order is one order out of many; a test that
  # leaks process-global state only fails in the orders where its victim runs
  # after it, so gating solely on collection order cannot see that class of
  # bug. Three such leaks were invisible to CI until 2026-08-02.
  "pytest-randomly>=3.12",
  # EXACT pin, and it MUST equal `rev:` in .pre-commit-config.yaml.
  #
  # This repo carries NO [tool.ruff] config, so ruff's defaults ARE the
  # project's lint and format policy — a different version is a different
  # policy. A range let the two disagree: pip resolved `>=0.6.0,<0.16` to the
  # newest (0.15.14) while pre-commit ran exactly 0.6.9, so `ruff format`
  # locally rewrote 108 files that the commit hook then rewrote back. Every
  # fresh dev environment reproduced it. A bound wide enough for a resolver to
  # choose within is a bound that lets the resolver choose the policy.
  #
  # The upper bound was already load-bearing for the same reason: on
  # 2026-08-02, 0.16 widened the defaults and CI went from green to 484 errors
  # on main and the release branch alike, none introduced by either. Raise this
  # deliberately, with the findings triaged, and move the pre-commit rev in the
  # same commit. tests/test_toolchain_pins.py fails if they drift apart.
  "ruff==0.15.14",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.5",
  # tests/test_sdist_completeness.py builds a real sdist, because a
  # MANIFEST.in directive that parses is not evidence the archive contains
  # the file. Guarding that test with a skip-if-missing would delete the
  # packaging check in CI — the one environment where nobody notices it is
  # gone — so the dependency is declared instead.
  "build>=1.0",
]

[project.scripts]
codevira = "mcp_server.cli:main"

[project.urls]
Homepage = "https://github.com/sachinshelke/codevira"
Repository = "https://github.com/sachinshelke/codevira"
Issues = "https://github.com/sachinshelke/codevira/issues"
Changelog = "https://github.com/sachinshelke/codevira/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*", "indexer*"]

[tool.setuptools.package-data]
mcp_server = ["data/**/*", "data/*", "graph/*.html"]

[tool.pytest.ini_options]
# v2.1.2 hardening: register custom markers so pytest doesn't emit
# UnknownMarkWarning. `integration` is for the post-release-style
# round-trip / cold-install / sandboxed-parent suites under
# tests/integration — they're slower than unit tests and use real
# fixtures (graph.db, MCP dispatcher, subprocess).
markers = [
    "integration: end-to-end / dispatcher / wheel-install tests (slower; opt-in)",
]
# pytest-randomly auto-enables the moment it is installed, which would silently
# shuffle EVERY existing command — `pytest`, `make test-unit`, `make test-e2e`,
# the release gauntlet. Ordering coverage is worth having (see
# `make test-unit-random`) but it should be a job you opt into, not a property
# that changes under a `pip install`. Default off here; `-p randomly` on the
# command line re-enables it (a later `-p <name>` overrides an earlier
# `-p no:<name>`), which is exactly what `test-unit-random` passes.
addopts = ["-p", "no:randomly"]
