<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-label="codevira orbit blueprint: a central in-repo memory that every AI coding tool reads and writes, six capabilities orbiting it, and a four-step escalation from remember to surface to warn to block.">
  <title>codevira — one memory, every AI tool, decisions that stick</title>
  <desc>A single landscape view. On the left, a panel lists the AI tools that connect: Claude Code, Claude Desktop, Cursor and Antigravity over the MCP server, and OpenAI Codex and GitHub Copilot which read the generated AGENTS.md file. Two arrows run from that panel into a glowing blue-to-violet ring at the centre: one labelled "records decisions", one labelled "recalls context". Inside the ring is the codevira logo mark — an orange shield holding a network of linked nodes, with an arrow breaking out of the top-right — above the codevira wordmark and the in-repo path .codevira/*.jsonl. Six capability cards orbit the ring on thin spokes: Decision Memory (why it won, what you rejected), Enforcement Engine (7 policies, 5 lifecycle events), Code Graph (blast radius: who calls this), Cross-Tool Sync (one log, every MCP client), Session Context (about 500-token brief, one call) and Anti-Regression (blocks re-breaking a fixed bug). Along the bottom, four connected chips intensify in colour left to right: REMEMBER, SURFACE, WARN, BLOCK.</desc>

