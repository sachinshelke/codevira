  <text x="36" y="768" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6472">Canonical memory in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.codevira/*.jsonl</tspan> · per-machine cache in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.codevira-cache/</tspan> · the generated <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AGENTS.md</tspan> is what non-MCP tools read</text>
