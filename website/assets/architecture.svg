<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1058" viewBox="0 0 900 1058"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Codevira architecture: entry points, the codevira binary, the two in-repo stores, and the global home"
     font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <title>Codevira architecture — where things run and where data lives</title>
  <desc>Four entry points (Claude Code, Claude Desktop, Cursor, Antigravity) speak stdio MCP to a single codevira binary; Codex and Copilot get no server and read AGENTS.md only; git commit invokes the engine. The binary wears three daily hats — MCP server, engine (7 policies, 5 event types), and CLI/indexer — plus an opt-in HTTP server (codevira serve, from the [http] extra). It reads and writes two fixed in-repo stores — .codevira/ canonical JSONL memory and .codevira-cache/ per-machine cache — plus a global home at ~/.codevira/. A get_data_dir() switch decides per project whether the graph and roadmap live in-repo or centralized.</desc>

  <defs>
    <marker id="ahBlue" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 z" fill="#4b8fd0"/>
    </marker>
    <marker id="ahAmber" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0.5 0.5 L8 3.5 L0.5 6.5" fill="none" stroke="#b07d22" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahSlate" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 z" fill="#7b8590"/>
    </marker>
    <marker id="ahSlateBack" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto">
      <path d="M9 0 L0 3.5 L9 7 z" fill="#7b8590"/>
    </marker>
    <marker id="ahPurple" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 z" fill="#8a6fd0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1058" fill="#fafbfc"/>
  <rect x="0.5" y="0.5" width="899" height="1057" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#1f2328">Codevira architecture — where things run, and where data lives</text>

  <!-- ============ GROUP A : ENTRY POINTS ============ -->
  <g>
    <rect x="20" y="44" width="730" height="104" rx="10" fill="#f0f3f6" stroke="#d0d7de" stroke-width="1"
          stroke-dasharray="4 3" stroke-linecap="round"/>
    <text x="30" y="64" font-size="11.5" font-weight="600" letter-spacing="0.06em" fill="#59636e">ENTRY POINTS</text>
    <text x="146" y="64" font-size="11.5" fill="#59636e">setup configures exactly these four MCP clients. Windsurf and Gemini-CLI are not targets.</text>

    <!-- A1 Claude Code -->
    <rect x="30" y="76" width="112" height="60" rx="6" fill="#e3f0fb" stroke="#4b8fd0" stroke-width="1.5"/>
    <text x="39" y="96" font-size="12.5" font-weight="600" fill="#0b4a80">Claude Code</text>
    <text x="39" y="115" font-size="11.5" fill="#0b4a80">MCP + 5 hooks</text>

    <!-- A2 Claude Desktop -->
    <rect x="152" y="76" width="126" height="60" rx="6" fill="#e3f0fb" stroke="#4b8fd0" stroke-width="1.5"/>
    <text x="161" y="96" font-size="12.5" font-weight="600" fill="#0b4a80">Claude Desktop</text>
    <text x="161" y="115" font-size="11.5" fill="#0b4a80">MCP only</text>

    <!-- A3 Cursor (dashed = the non-uniform case) -->
    <rect x="288" y="76" width="174" height="60" rx="6" fill="#e3f0fb" stroke="#4b8fd0" stroke-width="1.5"
          stroke-dasharray="5 3" stroke-linecap="round"/>
    <text x="297" y="96" font-size="12.5" font-weight="600" fill="#0b4a80">Cursor</text>
    <text x="297" y="114" font-size="11.5" fill="#0b4a80">MCP only — entry is NOT</text>
    <text x="297" y="130" font-size="11.5" fill="#0b4a80">--project-dir pinned</text>

    <!-- A4 Antigravity -->
    <rect x="472" y="76" width="116" height="60" rx="6" fill="#e3f0fb" stroke="#4b8fd0" stroke-width="1.5"/>
    <text x="481" y="96" font-size="12.5" font-weight="600" fill="#0b4a80">Antigravity</text>
    <text x="481" y="114" font-size="11.5" fill="#0b4a80">MCP + 1 hook</text>
    <text x="481" y="130" font-size="11.5" fill="#0b4a80">(PreToolUse)</text>

    <!-- A5 Codex / Copilot : NOT clients -->
    <rect x="598" y="76" width="142" height="60" rx="6" fill="#e8ecf0" stroke="#8c96a0" stroke-width="1.5"/>
    <text x="607" y="96" font-size="12.5" font-weight="600" fill="#39414a">Codex · Copilot</text>
    <text x="607" y="114" font-size="11.5" fill="#39414a">no MCP, no hooks</text>
    <text x="607" y="130" font-size="11.5" fill="#39414a">AGENTS.md only</text>

  </g>

  <!-- ============ A6 : git ============ -->
  <g>
    <rect x="758" y="44" width="126" height="104" rx="10" fill="#f0f3f6" stroke="#d0d7de" stroke-width="1"
          stroke-dasharray="4 3" stroke-linecap="round"/>
    <text x="768" y="64" font-size="11.5" font-weight="600" letter-spacing="0.06em" fill="#59636e">GIT</text>
    <rect x="766" y="76" width="110" height="60" rx="6" fill="#fbeed6" stroke="#c08a2e" stroke-width="1.5"/>
    <text x="775" y="96" font-size="12.5" font-weight="600" fill="#7a4d06">git commit</text>
    <text x="775" y="115" font-size="11.5" fill="#7a4d06">any editor</text>
  </g>

  <!-- ============ GROUP B : ONE BINARY ============ -->
  <g>
    <rect x="20" y="208" width="864" height="162" rx="10" fill="#f0f3f6" stroke="#d0d7de" stroke-width="1"/>
    <text x="30" y="228" font-size="11.5" font-weight="600" letter-spacing="0.06em" fill="#59636e">ONE BINARY</text>
    <text x="874" y="228" font-size="11.5" text-anchor="end" fill="#59636e"
          font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">codevira · one pipx venv · ~/.local/bin/codevira</text>

    <!-- B1 MCP server (primary box) -->
    <rect x="30" y="240" width="300" height="82" rx="6" fill="#e3f0fb" stroke="#4b8fd0" stroke-width="2"/>
    <text x="39" y="260" font-size="12.5" font-weight="600" fill="#0b4a80">MCP server (stdio)</text>
    <g font-size="11.5" fill="#0b4a80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="39" y="280">codevira --project-dir &lt;repo&gt;</text>
      <text x="39" y="297">36 tools advertised (37 defined)</text>
      <text x="39" y="314">one server process per project</text>
    </g>

    <!-- B2 engine -->
    <rect x="340" y="240" width="308" height="82" rx="6" fill="#fbeed6" stroke="#c08a2e" stroke-width="2"/>
    <text x="349" y="260" font-size="12.5" font-weight="600" fill="#7a4d06">engine</text>
    <g font-size="11.5" fill="#7a4d06" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="349" y="280">codevira engine handle &lt;Event&gt;</text>
      <text x="349" y="297">codevira engine pre-commit</text>
      <text x="349" y="314">7 policies · 5 event types · 1 dispatch()</text>
    </g>

    <!-- B3 CLI + indexer -->
    <rect x="658" y="240" width="216" height="82" rx="6" fill="#e8ecf0" stroke="#8c96a0" stroke-width="1.5"/>
    <text x="667" y="260" font-size="12.5" font-weight="600" fill="#39414a">CLI + indexer</text>
    <g font-size="11.5" fill="#39414a" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="667" y="280">init · setup · index</text>
      <text x="667" y="297">doctor · register-all</text>
    </g>

    <g font-size="11.5" fill="#59636e">
      <text x="470" y="342">codevira serve (HTTP/Starlette): a separate opt-in</text>
      <text x="470" y="359">process, not the daily path.</text>
    </g>
  </g>

  <!-- ============ GROUP C : IN THE REPO ============ -->
  <g>
    <rect x="20" y="470" width="372" height="442" rx="10" fill="#f0f3f6" stroke="#d0d7de" stroke-width="1"
          stroke-dasharray="4 3" stroke-linecap="round"/>
    <text x="30" y="490" font-size="11.5" font-weight="600" letter-spacing="0.06em" fill="#59636e">IN THE REPO &#160;&#160;&lt;project&gt;/</text>

    <!-- C1 canonical memory -->
    <rect x="30" y="502" width="338" height="112" rx="6" fill="#e3f0fb" stroke="#4b8fd0" stroke-width="1.5"/>
    <text x="39" y="523" font-size="12.5" font-weight="600" fill="#0b4a80">.codevira/ — canonical memory</text>
    <g font-size="11.5" fill="#0b4a80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="39" y="543">decisions.jsonl · digest.jsonl</text>
      <text x="39" y="560">outcomes.jsonl · sessions.jsonl</text>
      <text x="39" y="577">skills.jsonl · manifest.yaml · config.yaml</text>
    </g>
    <rect x="39" y="586" width="176" height="18" rx="9" fill="#fbeed6" stroke="#c08a2e" stroke-width="1"/>
    <text x="48" y="599" font-size="10.5" font-weight="600" letter-spacing="0.04em" fill="#7a4d06">GIT-TRACKED? DEPENDS</text>

    <!-- conditional callout -->
    <rect x="30" y="626" width="3" height="40" rx="1.5" fill="#c08a2e"/>
    <text x="41" y="640" font-size="11.5" fill="#7a4d06">gitignored by default (memory stays per-machine).</text>
    <text x="41" y="657" font-size="11.5" fill="#7a4d06">codevira init --shared keeps it git-tracked for teams.</text>

    <!-- C2 per-machine cache -->
    <rect x="30" y="678" width="338" height="128" rx="6" fill="#e8ecf0" stroke="#8c96a0" stroke-width="1.5"/>
    <text x="39" y="699" font-size="12.5" font-weight="600" fill="#39414a">.codevira-cache/ — per-machine</text>
    <g font-size="11.5" fill="#39414a" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="39" y="719">always gitignored · never worktree-redirects</text>
      <text x="39" y="736">fts5.sqlite  &#8592; the ONLY rebuildable file</text>
      <text x="39" y="753">working.jsonl · activity.jsonl</text>
      <text x="39" y="770">enforcement.jsonl · enforcer_outcomes.jsonl</text>
      <text x="39" y="787">active_sessions.jsonl</text>
    </g>

    <!-- C3 generated files -->
    <rect x="30" y="818" width="338" height="78" rx="6" fill="#e8ecf0" stroke="#8c96a0" stroke-width="1.5"/>
    <text x="39" y="839" font-size="12.5" font-weight="600" fill="#39414a">AGENTS.md  ·  .gitattributes</text>
    <g font-size="11.5" fill="#39414a" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="39" y="859">generated (marker-fenced)</text>
      <text x="39" y="876">.codevira/decisions.jsonl merge=codevira-jsonl</text>
    </g>
  </g>

  <!-- ============ GROUP D : GLOBAL HOME ============ -->
  <g>
    <rect x="533" y="470" width="351" height="346" rx="10" fill="#f0f3f6" stroke="#d0d7de" stroke-width="1"
          stroke-dasharray="4 3" stroke-linecap="round"/>
    <text x="543" y="490" font-size="11.5" font-weight="600" letter-spacing="0.02em" fill="#59636e">GLOBAL HOME &#160;~/.codevira/ &#160;($CODEVIRA_HOME)</text>

    <rect x="543" y="502" width="331" height="86" rx="6" fill="#ece6f9" stroke="#8a6fd0" stroke-width="1.5"/>
    <text x="552" y="523" font-size="12.5" font-weight="600" fill="#4c2d8f">global.db</text>
    <g font-size="11.5" fill="#4c2d8f" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="552" y="543">projects · global_preferences · global_rules</text>
      <text x="552" y="561" font-weight="700">holds NO decisions</text>
    </g>

    <rect x="543" y="606" width="331" height="86" rx="6" fill="#ece6f9" stroke="#8a6fd0" stroke-width="1.5"/>
    <text x="552" y="627" font-size="12.5" font-weight="600" fill="#4c2d8f">device_id · update_check.json</text>
    <g font-size="11.5" fill="#4c2d8f" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="552" y="647">logs/crashes.log · snapshots/&lt;slug&gt;/</text>
      <text x="552" y="665">run/&lt;pid&gt;.json</text>
    </g>

    <rect x="543" y="710" width="331" height="86" rx="6" fill="#ece6f9" stroke="#8a6fd0" stroke-width="1.5"/>
    <text x="552" y="731" font-size="12.5" font-weight="600" fill="#4c2d8f">projects/&lt;slug&gt;/</text>
    <g font-size="11.5" fill="#4c2d8f" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
      <text x="552" y="751">config.yaml · metadata.json · roadmap.yaml</text>
      <text x="552" y="769">graph/graph.db · graph/fixes.db · codeindex/</text>
    </g>
  </g>

  <!-- ============ E1 : the get_data_dir() switch ============ -->
  <g>
    <path d="M398 620 L410 586 L515 586 L527 620 L515 654 L410 654 Z"
          fill="#ece6f9" stroke="#8a6fd0" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>
    <text x="462" y="616" font-size="11.5" text-anchor="middle" fill="#4c2d8f" font-weight="600"
          font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">get_data_dir()</text>
    <text x="462" y="634" font-size="10.5" text-anchor="middle" fill="#4c2d8f">resolved per project</text>

    <path d="M396 620 L346 620" fill="none" stroke="#8a6fd0" stroke-width="1.5" stroke-dasharray="6 4"
          stroke-linecap="round" marker-end="url(#ahPurple)"/>
    <path d="M529 626 L539 646" fill="none" stroke="#8a6fd0" stroke-width="1.5" stroke-dasharray="6 4"
          stroke-linecap="round" marker-end="url(#ahPurple)"/>

    <g font-size="11.5" fill="#4c2d8f">
      <text x="400" y="682">&#8592; this repo:</text>
      <text x="400" y="698">in-repo</text>
      <text x="400" y="722">&#8594; fresh init:</text>
      <text x="400" y="738">centralized</text>
    </g>
  </g>

  <!-- ============ ARROWS ============ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Class 1: MCP protocol (blue) -->
    <g stroke="#4b8fd0" stroke-width="2">
      <path d="M86 136 L86 166 L528 166 L528 136"/>
      <path d="M215 136 L215 166"/>
      <path d="M200 166 L200 205" marker-end="url(#ahBlue)"/>
      <path d="M450 136 L450 205" stroke-dasharray="6 4" marker-end="url(#ahBlue)"/>
    </g>

    <!-- Class 2: hook invocation (amber) -->
    <g stroke="#c08a2e" stroke-width="2">
      <path d="M112 136 L112 182"/>
      <path d="M550 136 L550 182"/>
      <path d="M821 136 L821 182"/>
      <path d="M821 182 L112 182"/>
      <path d="M430 182 L430 205" marker-end="url(#ahAmber)"/>
    </g>

    <!-- Class 3: file read / write (slate) -->
    <g stroke="#7b8590" stroke-width="1.5">
      <path d="M230 372 L230 498" marker-start="url(#ahSlateBack)" marker-end="url(#ahSlate)"/>
      <path d="M350 372 L350 498" marker-end="url(#ahSlate)"/>
      <path d="M300 372 L300 392 L378 392 L378 740 L370 740" marker-end="url(#ahSlate)"/>
      <path d="M430 372 L430 384 L388 384 L388 780 L370 780" marker-end="url(#ahSlate)"/>
      <path d="M845 372 L845 464" marker-end="url(#ahSlate)"/>
      <path d="M668 136 L668 160 L892 160 L892 924 L200 924 L200 898"
            stroke-dasharray="5 4" marker-end="url(#ahSlate)"/>
    </g>
  </g>

  <!-- ============ EDGE LABELS (halo under text) ============ -->
  <g font-size="11.5" font-weight="500">
    <rect x="236" y="149" width="202" height="17" rx="3" fill="#fafbfc"/>
    <text x="242" y="162" fill="#0b4a80">stdio MCP · --project-dir &lt;repo&gt;</text>

    <rect x="466" y="188" width="270" height="17" rx="3" fill="#fafbfc"/>
    <text x="472" y="201" fill="#0b4a80">stdio, unpinned — binds via cwd / MCP roots</text>

    <rect x="116" y="145" width="56" height="17" rx="3" fill="#fafbfc"/>
    <text x="122" y="158" fill="#7a4d06">5 hooks</text>

    <rect x="556" y="145" width="120" height="17" rx="3" fill="#fafbfc"/>
    <text x="562" y="158" fill="#7a4d06">1 hook: PreToolUse</text>

    <rect x="736" y="145" width="74" height="17" rx="3" fill="#fafbfc"/>
    <text x="742" y="158" fill="#7a4d06">pre-commit</text>

    <rect x="36" y="374" width="182" height="34" rx="3" fill="#fafbfc"/>
    <text x="42" y="388" fill="#39414a">read + append</text>
    <text x="42" y="404" fill="#39414a">file_lock &#8594; fsync &#8594; os.replace</text>

    <rect x="238" y="374" width="108" height="17" rx="3" fill="#fafbfc"/>
    <text x="244" y="387" fill="#39414a">working memory</text>

    <rect x="240" y="396" width="136" height="17" rx="3" fill="#fafbfc"/>
    <text x="246" y="409" fill="#39414a">reads locked decisions</text>

    <rect x="396" y="374" width="164" height="17" rx="3" fill="#fafbfc"/>
    <text x="402" y="387" fill="#39414a">appends enforcement.jsonl</text>

    <rect x="742" y="374" width="104" height="17" rx="3" fill="#fafbfc"/>
    <text x="748" y="387" fill="#39414a">registers project</text>

    <rect x="80" y="916" width="116" height="17" rx="3" fill="#fafbfc"/>
    <text x="86" y="929" fill="#39414a">reads AGENTS.md</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g>
    <rect x="20" y="940" width="864" height="38" rx="10" fill="#f0f3f6" stroke="#d0d7de" stroke-width="1"
          stroke-dasharray="4 3" stroke-linecap="round"/>
    <g stroke-linecap="round" fill="none">
      <path d="M30 959 L60 959" stroke="#4b8fd0" stroke-width="2"/>
      <path d="M262 959 L292 959" stroke="#c08a2e" stroke-width="2"/>
      <path d="M520 959 L550 959" stroke="#7b8590" stroke-width="1.5"/>
      <path d="M672 959 L702 959" stroke="#8a6fd0" stroke-width="1.5" stroke-dasharray="6 4"/>
    </g>
    <g font-size="11.5" fill="#39414a">
      <text x="66" y="963">MCP protocol (stdio JSON-RPC)</text>
      <text x="298" y="963">hook invocation (&#8594; codevira engine)</text>
      <text x="556" y="963">file read / write</text>
      <text x="708" y="963">resolved by get_data_dir()</text>
    </g>
  </g>

  <!-- ============ FOOTNOTE RAIL ============ -->
  <g font-size="10.5" fill="#59636e">
    <text x="30" y="998">Dashed blue = the Cursor exception: its entry is bare (args: []), unpinned, and is not written by register-all.</text>
    <text x="30" y="1013">Codex/Copilot get no server — their whole integration is the generated AGENTS.md. codevira serve requires the [http] extra.</text>
    <text x="30" y="1028">.codevira/ redirects to the main worktree; .codevira-cache/ does not. git pre-commit enforcement is file-level — it sets no proposed_diff.</text>
    <text x="30" y="1043">Claude Code's 5 hooks: SessionStart · UserPromptSubmit · PreToolUse · PostToolUse · Stop.</text>
  </g>
</svg>
