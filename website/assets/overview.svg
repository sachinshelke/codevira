  <text x="36" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1f27">One memory. Every AI tool. Decisions that stick.</text>
  <text x="36" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6472">A local-first MCP server. One shared decision log — and the ones you lock are refused.</text>

