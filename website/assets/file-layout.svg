<text class="f" x="48" y="172">decisions.jsonl</text><text class="d" x="196" y="172">full text + metadata (append-only)</text>
<text class="f" x="48" y="194">digest.jsonl</text><text class="d" x="196" y="194">slim summary for prompt injection</text>
<text class="f" x="48" y="216">outcomes.jsonl</text><text class="d" x="196" y="216">kept/reverted, from git observation</text>
<text class="f" x="48" y="238">manifest.yaml</text><text class="d" x="196" y="238">tag&#8594;ids, file&#8594;ids index (regenerated)</text>
<text class="f" x="48" y="260">enforcement.yaml</text><text class="d" x="196" y="260">which decisions hard-block</text>
<text class="f" x="48" y="282">config.yaml</text><text class="d" x="196" y="282">project settings</text>
<text class="f" x="48" y="304">sessions.jsonl</text><text class="d" x="196" y="304">session events</text>
<text class="f" x="48" y="326">roadmap.yaml</text><text class="d" x="196" y="326">phase tracking</text>
<text class="f" x="48" y="348">skills.jsonl</text><text class="d" x="196" y="348">once you record a skill</text>
<text class="mut" x="48" y="368">roadmap.yaml and skills.jsonl appear on first use; codevira init writes the rest.</text>

<!-- AGENTS.md, generated from the log -->
<rect x="546" y="120" width="318" height="62" rx="11" fill="#ffffff" stroke="#d9d6f2" stroke-width="1" filter="url(#sh)"/>
<path d="M558 120.6 H584" class="rule" stroke="#5a5fe0"/>
<text class="m" x="558" y="142">AGENTS.md</text>
<text class="d" x="558" y="162">&#8804;5 KB slim contract, generated from <tspan font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace">.codevira/</tspan></text>
<text class="d" x="558" y="176">&#8212; the file Codex and Copilot read</text>
<path d="M522 152 H534 V151 H540" fill="none" stroke="#5a5fe0" stroke-width="1.6" stroke-linecap="round" marker-end="url(#aViolet)"/>

<!-- .codevira-cache/ : rebuildable -->
<rect x="546" y="196" width="318" height="120" rx="11" fill="#ffffff" stroke="#dfe4ec" stroke-width="1" filter="url(#sh)"/>
<path d="M558 196.6 H584" class="rule" stroke="#6b7683"/>
<text class="m" x="558" y="218">.codevira-cache/</text>
<text class="d" x="558" y="236">gitignored &#183; per-machine &#183; rebuildable</text>
<path d="M558 246 H852" stroke="#dfe4ec" stroke-width="1"/>
<text class="f" x="558" y="266">fts5.sqlite</text><text class="d" x="664" y="266">FTS5 index over decisions</text>
<text class="f" x="558" y="286">hash-cache.db</text><text class="d" x="664" y="286">file change detection</text>
<text class="f" x="558" y="306">working.jsonl</text><text class="d" x="664" y="306">intra-session scratchpad</text>

<rect x="546" y="328" width="318" height="48" rx="11" fill="#ecf0f6" stroke="#dfe4ec" stroke-width="1"/>
<text class="d" x="558" y="348">The code graph is a per-project SQLite db</text>
<text class="d" x="558" y="364">under ~/.codevira/ &#8212; not in your repo.</text>

