<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="codevira solution blueprint: one memory, every AI tool, decisions that stick. A four-step escalation from remember to surface to warn to block, then a three-act flow: your AI tools, one shared memory in your repo, and what you get back.">
  <title>codevira — one memory, every AI tool, decisions that stick</title>
  <desc>A landscape blueprint of codevira, a local-first MCP server that gives every AI coding agent on your machine one shared in-repo memory of decisions and the reasoning behind them. The hero states the promise beside a four-step escalation of ascending blocks — Remember (stored), Surface (injected), Warn (flagged) and Block (refused) — all standing on one baseline, with Block the tallest and filled with a blue to violet gradient. Below runs a three-act flow. Act one lists the AI tools: Claude Code, Claude Desktop, Cursor and Antigravity connect over the MCP server, while OpenAI Codex and GitHub Copilot read the generated AGENTS.md. Act two is codevira itself, holding Decision Memory in .codevira/*.jsonl and an Enforcement Engine of 7 policies across 5 lifecycle events, with Code Graph, Cross-Tool Sync, Session Context, Anti-Regression, Skill Library and Working Memory available to the agent. Act three is what the developer gets back: no re-explaining, decisions that survive, one memory across every tool, and everything staying on the machine.</desc>

